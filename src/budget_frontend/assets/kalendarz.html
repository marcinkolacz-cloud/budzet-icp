<!DOCTYPE html>
<html lang="pl"><head><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1c1915"><meta name="apple-mobile-web-app-title" content="Budget"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kalendarz</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="theme.css"><script src="theme.js"></script>
<style>
.ctrlb .sp{flex:1}.ctrlb strong{font-size:15px;letter-spacing:-.01em;min-width:150px}
.ctrlb .ar{width:32px;height:32px;padding:0;display:grid;place-items:center;font-size:17px;line-height:1}
.ctrlb #q{width:180px;padding:6px 12px;border-radius:999px}
.cl{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}
.cl>section{margin-top:0}
#main{padding:0;overflow:hidden}
/* miesiac */
.wh{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
.wh span{padding:9px 10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(118px,1fr)}
.mc{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 6px 4px;min-width:0;display:flex;flex-direction:column;gap:3px;cursor:pointer;transition:background .12s}
.mc:nth-child(7n){border-right:0}.mc:hover{background:color-mix(in srgb,var(--field) 60%,transparent)}
.mc.we{background:color-mix(in srgb,var(--field) 45%,transparent)}.mc.out .dn{color:var(--muted);opacity:.55}
.mc.dov{background:color-mix(in srgb,var(--acc) 10%,transparent);outline:2px dashed color-mix(in srgb,var(--acc) 50%,transparent);outline-offset:-3px}
.dn{font-size:12.5px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;margin-bottom:1px;font-variant-numeric:tabular-nums}
.mc.td .dn{background:var(--acc);color:var(--acc-ink)}
.ch{--c:#4f46e5;display:flex;gap:5px;align-items:center;min-width:0;padding:2px 7px;border-radius:6px;font-size:12px;line-height:1.35;color:var(--ink);background:color-mix(in srgb,var(--c) 14%,var(--card));border-left:3px solid var(--c);cursor:pointer;user-select:none}
.ch:hover{background:color-mix(in srgb,var(--c) 24%,var(--card))}
.ch.tm{background:transparent;border-left:0;padding-left:2px}.ch.tm::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.ch.tm:hover{background:color-mix(in srgb,var(--c) 12%,transparent)}
.ch b{font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted);flex:none}
.ch span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch.dn2 span{text-decoration:line-through;opacity:.55}.ch .tk{flex:none;width:11px;height:11px;border:1.5px solid var(--c);border-radius:3px}.ch.dn2 .tk{background:var(--c)}
.ch[draggable=true]{cursor:grab}.ch.drg{opacity:.4}
.more{font-size:11.5px;color:var(--muted);padding:1px 6px;border:0;background:transparent;text-align:left;border-radius:6px}
html[data-theme] .more{background:transparent}.more:hover{color:var(--ink)}
/* tydzien */
.wkh{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line)}
.wkh>div{padding:8px 6px;text-align:center;border-left:1px solid var(--line);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
.wkh>div:first-child{border-left:0;cursor:default}
.wkh strong{display:block;font-size:20px;letter-spacing:-.03em;color:var(--ink);text-transform:none;margin-top:2px;font-weight:600}
.wkh .td strong{color:var(--acc)}
.wad{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line);min-height:30px}
.wad>div{border-left:1px solid var(--line);padding:3px;display:flex;flex-direction:column;gap:2px;min-width:0}
.wad>div:first-child{border-left:0;font-size:10.5px;color:var(--muted);display:grid;place-items:center;padding:0}
.wsc{height:min(66vh,680px);overflow:auto;position:relative}
.wg{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));position:relative}
.wg .hr{position:relative}.wg .hr span{position:absolute;right:8px;transform:translateY(-50%);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.wc{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--H));cursor:crosshair}
.wc.td{background-color:color-mix(in srgb,var(--acc) 5%,transparent)}.wc.dov{background-color:color-mix(in srgb,var(--acc) 10%,transparent)}
.be{--c:#4f46e5;position:absolute;left:2px;right:3px;border-radius:7px;padding:3px 7px;font-size:12px;line-height:1.3;overflow:hidden;background:color-mix(in srgb,var(--c) 18%,var(--card));border-left:3px solid var(--c);color:var(--ink);cursor:pointer;box-shadow:0 1px 2px #0001}
.be:hover{background:color-mix(in srgb,var(--c) 28%,var(--card));z-index:3}
.be b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.be small{color:var(--muted);font-variant-numeric:tabular-nums}
.be[draggable=true]{cursor:grab}.be.drg{opacity:.4}
.nowl{position:absolute;left:0;right:0;height:2px;background:var(--neg);z-index:4;pointer-events:none}.nowl::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--neg)}
/* lista */
.ag{padding:6px 10px 14px}
.agd{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:12px 6px;border-bottom:1px solid var(--line)}
.agd:last-child{border-bottom:0}
.agd h3{margin:0;font-size:13px;font-weight:600}.agd h3 small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:2px}
.agd.td h3{color:var(--acc)}
.agi{display:grid;gap:4px}
.ai{--c:#4f46e5;display:grid;grid-template-columns:auto 96px 1fr;gap:12px;align-items:center;padding:7px 10px;border-radius:10px;cursor:pointer}
.ai:hover{background:var(--field)}
.ai i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.ai .t{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ai .n small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai.dn2 .n>span{text-decoration:line-through;opacity:.55}
.emp{padding:48px 16px;text-align:center;color:var(--muted)}
/* boczny */
aside{display:grid;gap:12px}aside section{margin-top:0!important}
aside h2{display:flex;justify-content:space-between;align-items:center}aside h2 small{font-size:12px;font-weight:400;color:var(--muted)}
.tl{display:grid;gap:2px;margin:0 -6px}
.tk2{--c:#4f46e5;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:7px 8px;border-radius:10px}
.tk2:hover{background:var(--field)}
.tk2 .cb{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--c);padding:0;display:grid;place-items:center;background:transparent;cursor:pointer;color:var(--acc-ink)}
.tk2.ok .cb{background:var(--c);color:#fff}.tk2.ok .cb::after{content:"✓";font-size:12px;line-height:1}
.tk2 .nm{font-size:13px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tk2.ok .nm{text-decoration:line-through;color:var(--muted)}
.tk2 .dt{font-size:11.5px;color:var(--muted);white-space:nowrap}.tk2 .dt.w{color:var(--neg);font-weight:600}
.qt{display:flex;gap:6px;margin-top:10px}.qt input{flex:1;border-radius:999px;padding:7px 12px}.qt button{flex:none;width:34px;height:34px;padding:0}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:11.5px;font-variant-numeric:tabular-nums}
.mini b{font-size:10px;color:var(--muted);font-weight:500;padding:3px 0;text-transform:uppercase}
.mini button{border:0;background:transparent;padding:0;height:30px;border-radius:50%;font-size:12px;position:relative}
html[data-theme] .mini button{background:transparent}
.mini button:hover{background:var(--field)!important}.mini button.o{color:var(--muted);opacity:.5}
.mini button.td{background:var(--acc)!important;color:var(--acc-ink)}.mini button.sel:not(.td){box-shadow:inset 0 0 0 1.5px var(--acc)}
.mini button.has::after{content:"";position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--acc)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.mh strong{font-size:13.5px}.mh button{width:28px;height:28px;padding:0}
/* dialog */
dialog{border:1px solid var(--line);border-radius:20px;padding:0;width:min(520px,calc(100vw - 24px));background:var(--card);color:var(--ink);box-shadow:0 24px 60px #0003}
dialog::backdrop{background:#0006;backdrop-filter:blur(2px)}
dialog[open]{animation:dg .16s ease-out}@keyframes dg{from{opacity:0;transform:translateY(6px) scale(.98)}}
.df{display:grid;gap:12px;padding:18px 20px 16px}
.df .ti{font-size:19px;font-weight:600;padding:8px 2px;border:0;border-bottom:2px solid var(--line);border-radius:0;background:transparent!important}
.df .ti:focus{outline:0;border-bottom-color:var(--acc)}
.df label{display:grid;gap:5px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.df .r2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.df .r3{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.df input.dim{opacity:.45}
.df select{border-radius:10px;padding:8px 10px;width:100%}
.df textarea{border:1px solid transparent;background:var(--field);border-radius:10px;padding:8px 10px;font:inherit;color:var(--ink);resize:vertical;min-height:64px}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--field);border:1px solid var(--line);border-radius:12px;justify-self:start}
html[data-theme] .seg button{border:0;background:transparent;border-radius:9px;padding:5px 14px;font-size:13px;color:var(--muted)}
html[data-theme] .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002;font-weight:600}
.sw{display:flex!important;align-items:center;gap:8px!important;text-transform:none!important;letter-spacing:0!important;font-size:13px!important;color:var(--ink)!important;cursor:pointer}
.sw input{width:16px;height:16px;accent-color:var(--acc);margin:0}
.cols{display:flex;gap:8px}.cols button{width:24px;height:24px;padding:0;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.cols button.on{box-shadow:0 0 0 2px var(--ink)}
.dfa{display:flex;gap:8px;align-items:center;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}.dfa .sp{flex:1}
.dfa .neg{color:var(--neg)}.hint{font-size:12px;color:var(--muted)}
@media (max-width:1100px){.cl{grid-template-columns:1fr}aside{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}}
@media (max-width:760px){
 .mg{grid-auto-rows:minmax(74px,1fr)}.mc{padding:4px 3px}.ch{font-size:10.5px;padding:1px 4px}.ch b{display:none}.wh span{padding:7px 4px;font-size:10px}
 .ctrlb #q{width:100%;flex:1 1 100%}.ctrlb strong{min-width:0}
 .agd{grid-template-columns:1fr;gap:6px}.ai{grid-template-columns:auto 70px 1fr}
 .wkh strong{font-size:15px}.wg,.wkh,.wad{grid-template-columns:40px repeat(7,minmax(0,1fr))}.be{font-size:10.5px;padding:2px 4px}.be small{display:none}
 .df .r2{grid-template-columns:1fr 1fr}.df .r2 label:first-child{grid-column:1/-1}
}
</style></head>

<script type="text/x-after-auth">
;(function go(){if(!window.CAL)return setTimeout(go,30);
const C=CAL,$=id=>document.getElementById(id),MON=["styczen","luty","marzec","kwiecien","maj","czerwiec","lipiec","sierpien","wrzesien","pazdziernik","listopad","grudzien"],WS=["Pn","Wt","Sr","Cz","Pt","So","Nd"];
const H=46,mk=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
let view="m",cur=C.today(),mini=cur.slice(0,7),q="";try{view=localStorage.getItem("kal-view")||"m";}catch{}
const mon=s=>{const d=C.P(s);return C.add(s,-((d.getDay()+6)%7));};
const ym=s=>{const d=C.P(s);return MON[d.getMonth()]+" "+d.getFullYear();};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const mins=t=>{if(!t)return 0;const[a,b]=t.split(":");return +a*60+ +b;};
const hm=m=>("0"+Math.floor(m/60)).slice(-2)+":"+("0"+m%60).slice(-2);
const match=e=>!q||(e.t+" "+(e.n||"")).toLowerCase().includes(q);
const items=(f,t)=>C.list(f,t).filter(x=>match(x.e));

function chip(x){const e=x.e,a=mk("div","ch"+(e.ad||!e.s||e.k==="t"?"":" tm")+(x.done?" dn2":""));a.style.setProperty("--c",col(e));
 if(e.k==="t")a.append(mk("i","tk"));if(!e.ad&&e.s)a.append(mk("b",null,e.s));a.append(mk("span",null,e.t));a.title=e.t+(C.timeLabel(e)?" · "+C.timeLabel(e):"")+(e.n?"\n"+e.n:"");
 a.onclick=ev=>{ev.stopPropagation();open(e,x.d);};drag(a,x);return a;}
let dragX=null;
function drag(a,x){if(x.e.r)return;a.draggable=true;a.ondragstart=ev=>{dragX=x;a.classList.add("drg");ev.dataTransfer.effectAllowed="move";try{ev.dataTransfer.setData("text/plain",x.e.id);}catch{}};a.ondragend=()=>{a.classList.remove("drg");dragX=null;};}
function drop(el,d,yFn){el.ondragover=ev=>{if(!dragX)return;ev.preventDefault();el.classList.add("dov");};el.ondragleave=()=>el.classList.remove("dov");
 el.ondrop=ev=>{ev.preventDefault();el.classList.remove("dov");if(!dragX)return;const o=C.load(),e=o.ev.find(z=>z.id===dragX.e.id);if(!e)return;
  if(e.done&&e.done[e.d]){e.done={[d]:1};}e.d=d;
  if(yFn&&!e.ad&&e.s){const dur=e.e?mins(e.e)-mins(e.s):60,st=Math.max(0,Math.min(1440-15,Math.round(yFn(ev)/15)*15));e.s=hm(st);if(e.e)e.e=hm(Math.min(1439,st+dur));}
  C.save(o);};}
/* --- widoki --- */
function rMonth(){const m=$("main"),f=C.P(cur.slice(0,7)+"-01"),st=mon(C.iso(f)),t=C.today();m.textContent="";
 const wh=mk("div","wh");WS.forEach(w=>wh.append(mk("span",null,w)));const g=mk("div","mg");
 const L=items(st,C.add(st,41)),by={};L.forEach(x=>(by[x.d]=by[x.d]||[]).push(x));
 for(let i=0;i<42;i++){const d=C.add(st,i),dt=C.P(d),c=mk("div","mc"+(dt.getMonth()!==f.getMonth()?" out":"")+(d===t?" td":"")+(dt.getDay()%6===0?" we":""));
  c.append(mk("span","dn",dt.getDate()));const a=by[d]||[],max=innerWidth<760?2:3;a.slice(0,max).forEach(x=>c.append(chip(x)));
  if(a.length>max){const b=mk("button","more","+"+(a.length-max)+" wiecej");b.type="button";b.onclick=ev=>{ev.stopPropagation();cur=d;setView("a");};c.append(b);}
  c.onclick=()=>open(null,d);drop(c,d);g.append(c);}
 m.append(wh,g);$("ttl").textContent=cap(ym(cur));}
function lanes(a){a.sort((x,y)=>x.s-y.s||y.e-x.e);let grp=[],end=-1,out=[];const flush=()=>{const L=[];grp.forEach(o=>{let i=L.findIndex(v=>v<=o.s);if(i<0){i=L.length;L.push(0);}L[i]=o.e;o.l=i;});grp.forEach(o=>o.n=L.length);out=out.concat(grp);grp=[];};
 a.forEach(o=>{if(o.s>=end&&grp.length)flush();grp.push(o);end=Math.max(end,o.e);});if(grp.length)flush();return out;}
function rWeek(){const m=$("main"),st=mon(cur),t=C.today();m.textContent="";m.style.setProperty("--H",H+"px");
 const L=items(st,C.add(st,6)),hd=mk("div","wkh"),ad=mk("div","wad"),sc=mk("div","wsc"),g=mk("div","wg");hd.append(mk("div"));ad.append(mk("div",null,"caly dz."));
 const gut=mk("div");for(let h=0;h<24;h++){const r=mk("div","hr");r.style.height=H+"px";if(h)r.append(mk("span",null,("0"+h).slice(-2)+":00"));gut.append(r);}g.append(gut);
 for(let i=0;i<7;i++){const d=C.add(st,i),dt=C.P(d),h=mk("div",d===t?"td":"");h.append(document.createTextNode(WS[i]),mk("strong",null,dt.getDate()));h.onclick=()=>{cur=d;setView("a");};hd.append(h);
  const day=L.filter(x=>x.d===d),a=mk("div");day.filter(x=>x.e.ad||!x.e.s).forEach(x=>a.append(chip(x)));drop(a,d);a.ondblclick=()=>open(null,d);ad.append(a);
  const c=mk("div","wc"+(d===t?" td":""));c.style.height=24*H+"px";
  lanes(day.filter(x=>!x.e.ad&&x.e.s).map(x=>{const s=mins(x.e.s);return {x,s,e:Math.max(s+30,x.e.e?mins(x.e.e):s+60)};})).forEach(o=>{const e=o.x.e,b=mk("div","be");b.style.setProperty("--c",col(e));
