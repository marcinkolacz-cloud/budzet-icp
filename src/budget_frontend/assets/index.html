<!DOCTYPE html>
<html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dashboard</title><link rel="stylesheet" href="base.css"></head>
<body><div class="app">
<nav class="topnav"><a href="index.html" class="on">Dashboard</a><a href="budzet.html">Budzet</a><a href="gielda.html">Gielda</a><a href="krypto.html">Krypto</a></nav>
<header><div><h1>Dashboard</h1><div class="sub" id="date"></div></div></header>
<div class="tiles" id="tiles"></div>
<section id="data" style="margin-top:18px"><h2 style="margin:0 0 4px;font-size:16px">Dane i kopie zapasowe</h2>
<p class="note" style="margin:0 0 10px">Excel zawiera budzet, kredyty i gielde. Kopia JSON zapisuje wszystkie dane konta i pozwala je przywrocic.</p>
<div class="form"><button id="xa" type="button">Excel - wszystko</button><button id="xb" type="button">Excel - budzet</button><button id="xg" type="button">Excel - gielda</button><button id="kb" class="dark" type="button">Kopia JSON</button><button id="ki" type="button">Import JSON</button></div></section>
</div>
<script src="auth.js"></script>
<script type="text/x-after-auth" src="gcore.js"></script>
<script type="text/x-after-auth" src="ccore.js"></script>
<script type="text/x-after-auth" src="io.js"></script>
<script type="text/x-after-auth">
;(function(){
const zl=n=>new Intl.NumberFormat("pl-PL",{style:"currency",currency:"PLN",maximumFractionDigits:0}).format(n||0);
const num=v=>{const n=Number(String(v??"").replace(/\s/g,"").replace(",","."));return Number.isFinite(n)?n:0};
const ld=k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch{return null}};
// Nowy kafelek = nowy wpis: {title, href, val: () => [wartosc, podpis, klasa?]}
const TILES=[
{title:"Budzet",href:"budzet.html",val(){
 const s=ld("budzet-app-v3"); if(!s||!s.rows||!s.rows.length) return ["–","brak danych"];
 const r=s.rows[s.month]||s.rows[0];
 const inc=s.incomes.reduce((a,k)=>a+num(r[k]),0), out=s.expenses.reduce((a,k)=>a+num(r[k]),0);
 return [zl(inc-out),(r.data||"")+" · zostaje"];}},
{title:"Gielda",href:"gielda.html",val(){
 const s=G.summary(G.S.ps); if(!s.rows.length&&!s.dPln) return ["–","dodaj pierwszy walor"];
 return [G.money(s.vUsd,"USD"),G.pct(s.profPct)+" · wplaty netto "+zl(s.dPln),G.cls(s.profUsd)];}},
{title:"Krypto",href:"krypto.html",val(){
 const s=K.summary(K.S.ps); if(!s.rows.length) return ["–","zaimportuj lub dodaj transakcje"];
 return [K.money(s.mv,"USD",0),K.pct(s.dayPct)+" 24h · wynik "+K.money(s.total,"USD",0),K.cls(s.total)];}}
];
const host=document.getElementById("tiles");
TILES.forEach(t=>{const [v,s,c]=t.val();const a=document.createElement("a");a.className="tile";a.href=t.href;
 const l=document.createElement("span");l.textContent=t.title;const b=document.createElement("strong");b.textContent=v;
 const m=document.createElement("small");m.textContent=s;if(c)m.className=c;a.append(l,b,m);host.append(a);});
document.getElementById("date").textContent=new Date().toLocaleDateString("pl-PL",{weekday:"long",day:"numeric",month:"long",year:"numeric"});

document.getElementById("xa").onclick=()=>IO.excel("all");document.getElementById("xb").onclick=()=>IO.excel("budzet");document.getElementById("xg").onclick=()=>IO.excel("gielda");
document.getElementById("kb").onclick=IO.backup;document.getElementById("ki").onclick=IO.pick;
})();
</script></body></html>
